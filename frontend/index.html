<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-[#f8fafc] flex flex-col items-center py-10">
    <div class="bg-[#f5f3ff] card rounded-xl p-6 mt-6 w-[500px] overflow-hidden shadow-2xl">
        <h1 class="text-[#0f172a] font-extrabold text-xl text-center">To Do List</h1>
        <div class="relative mt-6">
            <input type="text" class="border-2 border-[#06b6d4]
            bg-[#f5f3ff]
            text-[#1e1b4b]
            outline-none
            rounded-md py-2 px-3 w-full
            pr-14">
            <button class="absolute right-2 top-1/2 -translate-y-1/2
            bg-[#0891b2] text-[#f5f3ff] rounded-md w-8 h-8
            flex items-center justify-center
            cursor-pointer
            transition duration-300 ease-in-out hover:scale-110 active:scale-95" 
            id="add-btn"><i class="fa-solid fa-plus"></i>
        </button>
        </div>
       <p id="edit-helper" class="text-[11px] text-gray-500 mt-2 hidden items-center gap-2 px-1">
            <span><i class="fa-solid fa-circle-info mr-1"></i><kbd class="bg-gray-200 text-gray-700 px-1 py-0.5 rounded text-[10px] font-semibold border border-gray-300">Enter</kbd> - Save</span>
            <span class="text-gray-300">//</span>
            <span><kbd class="bg-gray-200 text-gray-700 px-1 py-0.5 rounded text-[10px] font-semibold border border-gray-300">Esc</kbd> - Cancel</span>
        </p>
        <ul id="task-list" class="mt-6 bg-[#0891b2] text-[#f5f3ff] rounded-xl divide-y-4 divide-[#f5f3ff]"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
